name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleRelease 2>&1 | tee build.log

      # Makes compiler errors visible as annotations on the run page.
      # GitHub shows max. 10 annotations per step, so errors are bundled into few multi-line ones.
      - name: Report build errors
        if: failure()
        run: |
          { grep -E '^e: |^ERROR:|error: ' build.log || true; grep -A12 'What went wrong' build.log || true; } \
            | grep -v '^> Task' | grep -v '^\s*$' | head -60 > errors.txt
          [ -s errors.txt ] || { echo "::error::Keine Fehlerzeilen gefunden - siehe Log"; exit 0; }
          split -l 6 errors.txt part_
          for f in part_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error::$msg"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "ILIAS-$V.apk"
          gh release create "v$V" "ILIAS-$V.apk" \
            --title "ILIAS $V" \
            --notes "Automatischer Build von \`${GITHUB_SHA::7}\`: $(git log -1 --pretty=%s)" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: ILIAS-apk
          path: ILIAS-*.apk
